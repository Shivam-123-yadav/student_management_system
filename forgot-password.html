{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'assets/plugins/bootstrap/css/bootstrap.min.css' %}">
    <style>

        body {
            background: #f5f7fa;
            font-family: "Poppins", sans-serif;
        }

        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 450px;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h3 {
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 22px;
            text-align: center;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            height: 45px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            background: #007bff;
        }

        .login-link {
            text-align: center;
            display: block;
            font-size: 15px;
            margin-top: 12px;
            color: #007bff;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .logo-area img {
            width: 75px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>

<body>
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="logo-area">
            <img src="{% static 'assets/img/logo.png' %}" alt="Logo">
        </div>

        <h3>Forgot Password</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <button type="submit" class="btn btn-primary">Send Reset Link</button>

            <a href="{% url 'login' %}" class="login-link">← Back to Login</a>
        </form>

    </div>
</div>
</body>
</html>
