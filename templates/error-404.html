{% extends 'Home/base.html' %}
{% load static %}
{% block body %}
<div class="page-wrapper">
    <div class="content container-fluid d-flex align-items-center justify-content-center" style="height: 80vh;">
        <div class="text-center">
            <h1 class="display-1" style="font-weight: 700; color: #007bff;">404</h1>
            <h3 class="mb-3" style="font-weight: 500; color: #333;">Oops! Page not found</h3>
            <p class="mb-4 text-muted">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="{% url 'index' %}" class="btn btn-primary btn-lg">Back to Dashboard</a>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f5f7fa;
        font-family: "Poppins", sans-serif;
    }

    .display-1 {
        font-size: 120px;
    }

    @media (max-width: 768px) {
        .display-1 {
            font-size: 80px;
        }
    }
</style>
{% endblock %}
