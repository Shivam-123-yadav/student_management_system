{% extends 'Home/base.html' %}
{% load static %}
{% block body %}

<div class="min-h-screen bg-gray-50 py-8 px-4">
    <div class="max-w-5xl mx-auto">
        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Add New Student</h1>
            <nav class="flex mt-2 text-sm">
                <a href="{% url 'student_list' %}" class="text-indigo-600 hover:text-indigo-800">Students</a>
                <span class="mx-2 text-gray-500">/</span>
                <span class="text-gray-600">Add Student</span>
            </nav>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <form method="POST" enctype="multipart/form-data" class="p-8 space-y-10">
                {% csrf_token %}

                <!-- Student Information Section -->
                <div>
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                        <span class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center mr-3 text-indigo-600 font-bold">1</span>
                        Student Information
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">First Name <span class="text-red-500">*</span></label>
                            <input type="text" name="first_name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Last Name <span class="text-red-500">*</span></label>
                            <input type="text" name="last_name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Student ID <span class="text-red-500">*</span></label>
                            <input type="text" name="student_id" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Gender <span class="text-red-500">*</span></label>
                            <select name="gender" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date of Birth <span class="text-red-500">*</span></label>
                            <input type="date" name="date_of_birth" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Class <span class="text-red-500">*</span></label>
                            <input type="text" name="student_class" placeholder="e.g. 10th A" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Section</label>
                            <input type="text" name="section" placeholder="A, B, C" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Religion</label>
                            <input type="text" name="religion" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Joining Date <span class="text-red-500">*</span></label>
                            <input type="date" name="joining_date" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Mobile Number <span class="text-red-500">*</span></label>
                            <input type="text" name="mobile_number" placeholder="+91 9876543210" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Admission Number <span class="text-red-500">*</span></label>
                            <input type="text" name="admission_number" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Student Photo</label>
                            <input type="file" name="student_image" accept="image/*" class="w-full px-4 py-3 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                    </div>
                </div>

                <!-- Parent Information Section -->
                <div class="border-t pt-10">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                        <span class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mr-3 text-purple-600 font-bold">2</span>
                        Parent / Guardian Information
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Father's Details -->
                        <div class="space-y-6 p-6 bg-gray-50 rounded-lg">
                            <h3 class="font-semibold text-lg text-indigo-700 mb-4">👨 Father's Details</h3>
                            <input type="text" name="father_name" placeholder="Father's Full Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <input type="text" name="father_occupation" placeholder="Occupation" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <input type="text" name="father_mobile" placeholder="Mobile Number" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <input type="email" name="father_email" placeholder="Email (optional)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <!-- Mother's Details -->
                        <div class="space-y-6 p-6 bg-pink-50 rounded-lg">
                            <h3 class="font-semibold text-lg text-pink-700 mb-4">👩 Mother's Details</h3>
                            <input type="text" name="mother_name" placeholder="Mother's Full Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500">
                            <input type="text" name="mother_occupation" placeholder="Occupation" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500">
                            <input type="text" name="mother_mobile" placeholder="Mobile Number" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500">
                            <input type="email" name="mother_email" placeholder="Email (optional)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500">
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="grid md:grid-cols-2 gap-6 mt-8">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Present Address <span class="text-red-500">*</span></label>
                            <textarea name="present_address" rows="3" required class="w-full px-4 py-3 border border-gray-300 rounded-lg fokus:ring-2 focus:ring-indigo-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Permanent Address <span class="text-red-500">*</span></label>
                            <textarea name="permanent_address" rows="3" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end pt-8 border-t">
                    <button type="submit" class="px-10 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-lg shadow-lg hover:from-indigo-700 hover:to-purple-700 transform hover:scale-105 transition duration-200">
                        Add Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Tailwind CDN (for quick testing - production mein properly include karna) -->
<script src="https://cdn.tailwindcss.com"></script>

{% endblock %}
