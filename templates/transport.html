{% extends 'Home/base.html' %}
{% load static %}
{% block body %}
<div class="page-wrapper">
<div class="content container-fluid">
  <div class="page-header">
    <h3 class="page-title">Transport</h3>
    <a href="{% url 'add_transport' %}" class="btn btn-primary float-right">Add Transport</a>
  </div>

  <div class="card">
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Route</th>
              <th>Driver</th>
              <th>Vehicle</th>
              <th>Timing</th>
            </tr>
          </thead>
          <tbody>
            {% for t in transports %}
            <tr>
              <td>{{ t.route_name }}</td>
              <td>{{ t.driver_name }}</td>
              <td>{{ t.vehicle_number }}</td>
              <td>{{ t.timing }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center">No Transport Records</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
  </div>
</div>
</div>
{% endblock %}
